apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: visit-counter
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "REGISTRY_HOST": {
          "username": "REGISTRY_USERNAME",
          "password": "REGISTRY_ACCESS_TOKEN",
          "auth": "BASE64_ENCODED_USERNAME_COLON_TOKEN"
        }
      }
    }