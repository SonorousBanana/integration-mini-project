name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: visit-counter-app/requirements*.txt

      - name: Install test dependencies
        working-directory: visit-counter-app
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: visit-counter-app
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --file visit-counter-app/Dockerfile --tag visit-counter:${{ github.sha }} visit-counter-app
